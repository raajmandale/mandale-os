<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>M-OS PatternGraph Viewer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body{
  background:#0b1020;
  color:white;
  font-family:Arial;
}
.node{
  stroke:#fff;
  stroke-width:2px;
}
.link{
  stroke:#888;
  stroke-width:2px;
}
</style>
</head>

<body>

<h2>M-OS PatternGraph Interactive Viewer</h2>

<svg width="900" height="500"></svg>

<script>

const data = {
nodes:[
 {id:"transform_data",pattern:"transform",backend:"CPU"},
 {id:"search_route",pattern:"search",backend:"OpenCL"},
 {id:"rank_results",pattern:"infer",backend:"AirLLM"}
],
links:[
 {source:"transform_data",target:"search_route"},
 {source:"search_route",target:"rank_results"}
]
};

const svg = d3.select("svg");

const simulation = d3.forceSimulation(data.nodes)
  .force("link",d3.forceLink(data.links).id(d=>d.id).distance(200))
  .force("charge",d3.forceManyBody().strength(-300))
  .force("center",d3.forceCenter(450,250));

const link = svg.selectAll(".link")
  .data(data.links)
  .enter()
  .append("line")
  .attr("class","link");

const node = svg.selectAll(".node")
  .data(data.nodes)
  .enter()
  .append("circle")
  .attr("class","node")
  .attr("r",25)
  .attr("fill","#4F8EF7")
  .call(d3.drag()
    .on("start",dragstarted)
    .on("drag",dragged)
    .on("end",dragended)
  );

const label = svg.selectAll(".label")
  .data(data.nodes)
  .enter()
  .append("text")
  .text(d=>d.id)
  .attr("fill","white");

simulation.on("tick",()=>{

link
  .attr("x1",d=>d.source.x)
  .attr("y1",d=>d.source.y)
  .attr("x2",d=>d.target.x)
  .attr("y2",d=>d.target.y);

node
  .attr("cx",d=>d.x)
  .attr("cy",d=>d.y);

label
  .attr("x",d=>d.x+30)
  .attr("y",d=>d.y);

});

function dragstarted(event,d){
 if(!event.active) simulation.alphaTarget(0.3).restart();
 d.fx=d.x;
 d.fy=d.y;
}

function dragged(event,d){
 d.fx=event.x;
 d.fy=event.y;
}

function dragended(event,d){
 if(!event.active) simulation.alphaTarget(0);
 d.fx=null;
 d.fy=null;
}

</script>

</body>
</html>
