  <circle cx="455" cy="315" r="96" fill="rgba(7,21,34,.88)" stroke="#ff7a18" stroke-width="2.5" filter="url(#orangeGlow)"/>
  <circle cx="455" cy="315" r="68" fill="none" stroke="#ff7a18" stroke-width="1" opacity=".45"/>
  <text x="455" y="309" text-anchor="middle" class="font label" style="font-size:18px">Execution Reactor</text>
  <text x="455" y="342" text-anchor="middle" class="font small" style="font-size:13px">RUN→DETECT→ROUTE→REUSE→PROVE</text>
</g>

<g class="floatB">
  <circle cx="1430" cy="315" r="96" fill="rgba(7,21,34,.88)" stroke="#ff7a18" stroke-width="2.5" filter="url(#orangeGlow)"/>
  <circle cx="1430" cy="315" r="68" fill="none" stroke="#ff7a18" stroke-width="1" opacity=".45"/>
  <text x="1430" y="309" text-anchor="middle" class="font label" style="font-size:18px">ppe-v2</text>
  <text x="1430" y="342" text-anchor="middle" class="font small" style="font-size:13px">Proof Authority</text>
</g>

<g class="floatB">
  <circle cx="430" cy="760" r="96" fill="rgba(7,21,34,.88)" stroke="#00d4ff" stroke-width="2.5" filter="url(#blueGlow)"/>
  <circle cx="430" cy="760" r="68" fill="none" stroke="#00d4ff" stroke-width="1" opacity=".45"/>
  <text x="430" y="754" text-anchor="middle" class="font label" style="font-size:18px">XLifelineAI</text>
  <text x="430" y="787" text-anchor="middle" class="font small" style="font-size:13px">Continuity Runtime</text>
</g>

<g class="floatB">
  <circle cx="1440" cy="760" r="96" fill="rgba(7,21,34,.88)" stroke="#00d4ff" stroke-width="2.5" filter="url(#blueGlow)"/>
  <circle cx="1440" cy="760" r="68" fill="none" stroke="#00d4ff" stroke-width="1" opacity=".45"/>
  <text x="1440" y="754" text-anchor="middle" class="font label" style="font-size:18px">mos-parameter-golf</text>
  <text x="1440" y="787" text-anchor="middle" class="font small" style="font-size:13px">Optimization Lab</text>
</g>

<g class="floatB">
  <circle cx="960" cy="850" r="96" fill="rgba(7,21,34,.88)" stroke="#ff7a18" stroke-width="2.5" filter="url(#orangeGlow)"/>
  <circle cx="960" cy="850" r="68" fill="none" stroke="#ff7a18" stroke-width="1" opacity=".45"/>
  <text x="960" y="844" text-anchor="middle" class="font label" style="font-size:18px">QBAIX</text>
  <text x="960" y="877" text-anchor="middle" class="font small" style="font-size:13px">Hybrid Compute Branch</text>
</g>

<g class="floatB">
  <circle cx="960" cy="245" r="86" fill="rgba(7,21,34,.88)" stroke="#00d4ff" stroke-width="2.5" filter="url(#blueGlow)"/>
  <circle cx="960" cy="245" r="58" fill="none" stroke="#00d4ff" stroke-width="1" opacity=".45"/>
  <text x="960" y="239" text-anchor="middle" class="font label" style="font-size:18px">Pattern Graph</text>
  <text x="960" y="272" text-anchor="middle" class="font small" style="font-size:13px">Runtime Cognition</text>
</g>
<text x="82" y="1015" class="font micro">QBAIX ORBITS INSIDE THE M-OS ECOSYSTEM • MANDALE-OS REMAINS ROOT</text>
</svg>