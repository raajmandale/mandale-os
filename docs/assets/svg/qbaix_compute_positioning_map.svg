
<svg width="1100" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 34px sans-serif; fill:#111; }
    .subtitle { font: 18px sans-serif; fill:#444; }
    .axis { stroke:#333; stroke-width:2; }
    .label { font:16px sans-serif; fill:#111; }
    .box { stroke:#333; stroke-width:2; rx:12; ry:12; }
    .text { font:18px sans-serif; fill:white; text-anchor:middle; dominant-baseline:middle; font-weight:bold;}
  </style>

  <!-- Title -->
  <text x="550" y="60" text-anchor="middle" class="title">Compute Architecture Positioning</text>
  <text x="550" y="90" text-anchor="middle" class="subtitle">HPC → QBAIX Hybrid → Quantum Systems</text>

  <!-- Axes -->
  <line x1="150" y1="450" x2="950" y2="450" class="axis"/>
  <line x1="150" y1="150" x2="150" y2="450" class="axis"/>

  <!-- Axis labels -->
  <text x="550" y="500" text-anchor="middle" class="label">Compute Model Evolution</text>
  <text x="60" y="300" transform="rotate(-90 60,300)" class="label">Architecture Capability</text>

  <!-- HPC -->
  <rect x="220" y="330" width="180" height="80" fill="#3498db" class="box"/>
  <text x="310" y="370" class="text">Traditional HPC</text>

  <!-- QBAIX -->
  <rect x="470" y="250" width="200" height="100" fill="#9b59b6" class="box"/>
  <text x="570" y="295" class="text">QBAIX Hybrid</text>

  <!-- Quantum -->
  <rect x="760" y="170" width="200" height="100" fill="#2c3e50" class="box"/>
  <text x="860" y="215" class="text">Quantum Systems</text>

  <!-- Arrows -->
  <line x1="400" y1="370" x2="470" y2="300" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="300" x2="760" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#555"/>
    </marker>
  </defs>

</svg>
