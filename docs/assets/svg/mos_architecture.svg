<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a0b8"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#0b1020"/>
  <text x="70" y="80" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">M-OS Architecture</text>
  <text x="70" y="122" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="24">Pattern Runtime for Hybrid Compute — locked Repo v0 visual architecture</text>

  <!-- Layer boxes -->
  <g filter="url(#shadow)">
    <rect x="90" y="180" rx="24" ry="24" width="1220" height="110" fill="#131a2b" stroke="#27314a" stroke-width="2"/>
    <rect x="90" y="330" rx="24" ry="24" width="1220" height="110" fill="#131a2b" stroke="#27314a" stroke-width="2"/>
    <rect x="90" y="480" rx="24" ry="24" width="1220" height="110" fill="#131a2b" stroke="#27314a" stroke-width="2"/>
    <rect x="90" y="630" rx="24" ry="24" width="1220" height="160" fill="#131a2b" stroke="#27314a" stroke-width="2"/>
  </g>

  <text x="130" y="225" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Applications + PatternGraph (PSTG)</text>
  <text x="130" y="262" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="20">Developers describe computational intent as canonical patterns: transform → search → infer</text>

  <text x="130" y="375" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">M-OS Runtime Core</text>
  <text x="130" y="412" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="20">Graph validation · topological execution order · data propagation · result collection</text>

  <text x="130" y="525" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Scheduler + Pattern Memory</text>
  <text x="130" y="562" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="20">Select backend per pattern using adapter support, cost estimates, constraints, and future memory hooks</text>

  <text x="130" y="675" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Compute Adapters + Backends</text>
  <text x="130" y="712" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="20">The adapter layer isolates the runtime from execution physics while preserving one interface</text>

  <!-- Adapter cards -->
  <g filter="url(#shadow)">
    <rect x="180" y="728" rx="18" ry="18" width="280" height="86" fill="#0f1627" stroke="#4F8EF7" stroke-width="3"/>
    <rect x="560" y="728" rx="18" ry="18" width="280" height="86" fill="#0f1627" stroke="#2BB673" stroke-width="3"/>
    <rect x="940" y="728" rx="18" ry="18" width="280" height="86" fill="#0f1627" stroke="#8F5BFF" stroke-width="3"/>
  </g>

  <text x="320" y="770" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">CPU Adapter</text>
  <text x="320" y="797" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="17">transform / aggregate / route</text>

  <text x="700" y="770" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">OpenCL Adapter</text>
  <text x="700" y="797" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="17">search / optimize / vector-heavy stages</text>

  <text x="1080" y="770" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">AirLLM Adapter</text>
  <text x="1080" y="797" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="17">infer / generate / AI-style ranking</text>

  <!-- Arrows -->
  <line x1="700" y1="290" x2="700" y2="330" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="700" y1="440" x2="700" y2="480" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="700" y1="590" x2="700" y2="630" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="70" y="860" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="18">Conceptual difference: traditional systems schedule processes; M-OS schedules patterns.</text>
</svg>
