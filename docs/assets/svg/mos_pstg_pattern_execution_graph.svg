
<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 34px sans-serif; fill:#111; }
    .subtitle { font: 18px sans-serif; fill:#444; }
    .node { stroke:#333; stroke-width:2; rx:14; ry:14; }
    .text { font:16px sans-serif; fill:white; text-anchor:middle; dominant-baseline:middle; font-weight:bold;}
    .label { font:16px sans-serif; fill:#111; text-anchor:middle;}
    .edge { stroke:#555; stroke-width:2; marker-end:url(#arrow); }
  </style>

  <!-- Title -->
  <text x="600" y="60" text-anchor="middle" class="title">Pattern State Transition Graph (PSTG)</text>
  <text x="600" y="95" text-anchor="middle" class="subtitle">M‑OS Pattern Execution Model</text>

  <!-- Arrow Definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Nodes -->
  <rect x="120" y="300" width="170" height="70" fill="#2d89ef" class="node"/>
  <text x="205" y="335" class="text">Input</text>

  <rect x="330" y="180" width="200" height="80" fill="#00a300" class="node"/>
  <text x="430" y="220" class="text">Transform</text>

  <rect x="330" y="420" width="200" height="80" fill="#00a300" class="node"/>
  <text x="430" y="460" class="text">Search</text>

  <rect x="600" y="180" width="200" height="80" fill="#da532c" class="node"/>
  <text x="700" y="220" class="text">Infer</text>

  <rect x="600" y="420" width="200" height="80" fill="#da532c" class="node"/>
  <text x="700" y="460" class="text">Optimize</text>

  <rect x="870" y="300" width="180" height="80" fill="#6a00ff" class="node"/>
  <text x="960" y="340" class="text">Output</text>

  <!-- Edges -->
  <line x1="290" y1="335" x2="330" y2="220" class="edge"/>
  <line x1="290" y1="335" x2="330" y2="460" class="edge"/>

  <line x1="530" y1="220" x2="600" y2="220" class="edge"/>
  <line x1="530" y1="460" x2="600" y2="460" class="edge"/>

  <line x1="800" y1="220" x2="870" y2="335" class="edge"/>
  <line x1="800" y1="460" x2="870" y2="335" class="edge"/>

  <!-- Bottom explanation -->
  <text x="600" y="640" class="label">
    Execution flows through pattern transitions instead of process threads.
  </text>

</svg>
