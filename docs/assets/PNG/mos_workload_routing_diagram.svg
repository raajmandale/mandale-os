
<svg width="1000" height="650" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 32px sans-serif; fill: #111; }
    .box { stroke:#333; stroke-width:2; rx:10; ry:10; fill:#f2f2f2; }
    .text { font: 18px sans-serif; fill:#111; text-anchor:middle; dominant-baseline:middle; }
    .arrow { stroke:#333; stroke-width:2; marker-end:url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <text x="500" y="50" class="title" text-anchor="middle">M-OS Structure-Aware Workload Routing</text>

  <!-- Incoming workload -->
  <rect x="400" y="100" width="200" height="60" class="box"/>
  <text x="500" y="130" class="text">Incoming Workload</text>

  <!-- Pattern analysis -->
  <rect x="400" y="200" width="200" height="60" class="box"/>
  <text x="500" y="230" class="text">Pattern Analysis</text>

  <!-- Decision -->
  <rect x="400" y="300" width="200" height="60" class="box"/>
  <text x="500" y="330" class="text">Resource Decision</text>

  <!-- CPU -->
  <rect x="150" y="420" width="200" height="70" class="box"/>
  <text x="250" y="455" class="text">CPU Path</text>

  <!-- GPU -->
  <rect x="400" y="420" width="200" height="70" class="box"/>
  <text x="500" y="455" class="text">GPU Path</text>

  <!-- Memory -->
  <rect x="650" y="420" width="200" height="70" class="box"/>
  <text x="750" y="455" class="text">Memory / Storage Path</text>

  <!-- Result -->
  <rect x="400" y="540" width="200" height="60" class="box"/>
  <text x="500" y="570" class="text">Execution Result</text>

  <!-- Arrows -->
  <line x1="500" y1="160" x2="500" y2="200" class="arrow"/>
  <line x1="500" y1="260" x2="500" y2="300" class="arrow"/>

  <line x1="500" y1="360" x2="250" y2="420" class="arrow"/>
  <line x1="500" y1="360" x2="500" y2="420" class="arrow"/>
  <line x1="500" y1="360" x2="750" y2="420" class="arrow"/>

  <line x1="250" y1="490" x2="500" y2="540" class="arrow"/>
  <line x1="500" y1="490" x2="500" y2="540" class="arrow"/>
  <line x1="750" y1="490" x2="500" y2="540" class="arrow"/>

</svg>
