<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a0b8"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#0b1020"/>
  <text x="60" y="70" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Pattern Graph</text>
  <text x="60" y="108" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="22">Canonical locked demo graph used in repo examples and visual runtime</text>

  <g filter="url(#shadow)">
    <rect x="120" y="200" rx="24" ry="24" width="260" height="150" fill="#0f1627" stroke="#4F8EF7" stroke-width="3"/>
    <rect x="470" y="200" rx="24" ry="24" width="260" height="150" fill="#0f1627" stroke="#2BB673" stroke-width="3"/>
    <rect x="820" y="200" rx="24" ry="24" width="260" height="150" fill="#0f1627" stroke="#8F5BFF" stroke-width="3"/>
  </g>

  <line x1="380" y1="275" x2="470" y2="275" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="730" y1="275" x2="820" y2="275" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="250" y="252" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">transform_data</text>
  <text x="250" y="288" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="24">pattern: transform</text>
  <text x="250" y="320" text-anchor="middle" fill="#4F8EF7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">backend: CPU</text>

  <text x="600" y="252" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">search_route</text>
  <text x="600" y="288" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="24">pattern: search</text>
  <text x="600" y="320" text-anchor="middle" fill="#2BB673" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">backend: OpenCL</text>

  <text x="950" y="252" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">rank_results</text>
  <text x="950" y="288" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="24">pattern: infer</text>
  <text x="950" y="320" text-anchor="middle" fill="#8F5BFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">backend: AirLLM</text>
</svg>
