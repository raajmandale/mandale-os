  <rect x="220" y="230" width="700" height="40" rx="12" ry="12" fill="#2BB673" opacity="0.95"/>
  <text x="570" y="257" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">OpenCL</text>

