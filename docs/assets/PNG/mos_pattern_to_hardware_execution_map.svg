
<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
<style>
.title { font: bold 34px sans-serif; fill:#111; }
.subtitle { font: 18px sans-serif; fill:#444; }
.box { stroke:#333; stroke-width:2; rx:14; ry:14; }
.text { font:18px sans-serif; fill:white; text-anchor:middle; dominant-baseline:middle; font-weight:bold;}
.small { font:16px sans-serif; fill:#111; text-anchor:middle;}
.arrow { stroke:#333; stroke-width:2; marker-end:url(#arrow); }
</style>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<polygon points="0 0, 10 3, 0 6" fill="#333"/>
</marker>
</defs>

<!-- Title -->
<text x="600" y="60" text-anchor="middle" class="title">Pattern → Hardware Execution Map</text>
<text x="600" y="95" text-anchor="middle" class="subtitle">How M-OS Routes Pattern Workloads to Compute Hardware</text>

<!-- Pattern Layer -->
<rect x="460" y="140" width="280" height="80" fill="#4A6CF7" class="box"/>
<text x="600" y="180" class="text">Pattern Engine</text>

<!-- Runtime -->
<rect x="440" y="270" width="320" height="90" fill="#9B59B6" class="box"/>
<text x="600" y="315" class="text">M-OS Runtime</text>
<text x="600" y="340" font-size="14" fill="white" text-anchor="middle">Pattern Analysis • Scheduler • Routing</text>

<!-- Hardware Targets -->
<rect x="180" y="440" width="220" height="90" fill="#3498db" class="box"/>
<text x="290" y="485" class="text">CPU</text>

<rect x="490" y="440" width="220" height="90" fill="#27ae60" class="box"/>
<text x="600" y="485" class="text">GPU</text>

<rect x="800" y="440" width="220" height="90" fill="#2c3e50" class="box"/>
<text x="910" y="485" class="text">AI / Accelerator</text>

<!-- Arrows -->
<line x1="600" y1="220" x2="600" y2="270" class="arrow"/>

<line x1="600" y1="360" x2="290" y2="440" class="arrow"/>
<line x1="600" y1="360" x2="600" y2="440" class="arrow"/>
<line x1="600" y1="360" x2="910" y2="440" class="arrow"/>

<!-- Bottom caption -->
<text x="600" y="620" class="small">
Patterns are analyzed by the M‑OS runtime and routed to the most efficient compute hardware.
</text>

</svg>
