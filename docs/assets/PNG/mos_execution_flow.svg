<svg width="1400" height="720" viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#90a0b8"/>
    </marker>
  </defs>

  <rect width="1400" height="720" fill="#0b1020"/>
  <text x="70" y="80" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">M-OS Execution Model</text>
  <text x="70" y="122" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="24">Runtime path for the locked demo graph: transform → search → infer</text>

  <!-- Flow steps -->
  <g filter="url(#shadow)">
    <rect x="80" y="240" rx="24" ry="24" width="220" height="120" fill="#131a2b" stroke="#27314a" stroke-width="2"/>
    <rect x="380" y="240" rx="24" ry="24" width="220" height="120" fill="#131a2b" stroke="#27314a" stroke-width="2"/>
    <rect x="680" y="240" rx="24" ry="24" width="220" height="120" fill="#131a2b" stroke="#27314a" stroke-width="2"/>
    <rect x="980" y="240" rx="24" ry="24" width="220" height="120" fill="#131a2b" stroke="#27314a" stroke-width="2"/>
  </g>

  <text x="190" y="288" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Load PSTG</text>
  <text x="190" y="320" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="18">Read graph JSON / build nodes</text>

  <text x="490" y="288" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Schedule</text>
  <text x="490" y="320" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="18">Choose best backend per pattern</text>

  <text x="790" y="288" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Execute</text>
  <text x="790" y="320" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="18">Run adapters in topological order</text>

  <text x="1090" y="288" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Report</text>
  <text x="1090" y="320" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="18">HTML / JSON / CSV artifacts</text>

  <line x1="300" y1="300" x2="380" y2="300" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="600" y1="300" x2="680" y2="300" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="900" y1="300" x2="980" y2="300" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- Tri compute lane -->
  <text x="70" y="470" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Demo Routing Lane</text>
  <text x="70" y="505" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="20">One problem expressed as patterns and routed across three execution styles</text>

  <g filter="url(#shadow)">
    <rect x="140" y="550" rx="20" ry="20" width="280" height="90" fill="#0f1627" stroke="#4F8EF7" stroke-width="3"/>
    <rect x="560" y="550" rx="20" ry="20" width="280" height="90" fill="#0f1627" stroke="#2BB673" stroke-width="3"/>
    <rect x="980" y="550" rx="20" ry="20" width="280" height="90" fill="#0f1627" stroke="#8F5BFF" stroke-width="3"/>
  </g>

  <text x="280" y="589" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">transform_data</text>
  <text x="280" y="618" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="18">CPU · normalize input cities</text>

  <text x="700" y="589" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">search_route</text>
  <text x="700" y="618" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="18">OpenCL · route search</text>

  <text x="1120" y="589" text-anchor="middle" fill="#e8eefc" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">rank_results</text>
  <text x="1120" y="618" text-anchor="middle" fill="#a8b2c7" font-family="Inter, Arial, sans-serif" font-size="18">AirLLM · AI-style ranking</text>

  <line x1="420" y1="595" x2="560" y2="595" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="840" y1="595" x2="980" y2="595" stroke="#90a0b8" stroke-width="6" marker-end="url(#arrow)"/>
</svg>
